# PR-CI: тестовый сьют репо на каждом PR и push в default. Заведён волной
# devtools 2026-09-01 (по следам инцидента kapelle#57: красный сьют без CI
# не видит никто). Actions запинены полными commit SHA (канон флота).
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
