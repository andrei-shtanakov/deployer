# =============================================================================
# Pilot DAG — Dark Factory pass 1
# =============================================================================
#
# The first backlog item carried end-to-end by the dispatcher control plane
# (slice 0, dispatcher spec 2026-08-22). It fixes ONE real defect in this
# repository:
#
#   todo://deployer/entrypoint-token-boundary-match
#   L1 `entrypoint_in_command` compares substrings, so short names like `app`
#   false-pass against `application.py`.
#
# Run through the contour, not by hand:
#   dispatcher UI → POST /api/runs/submit → maestro run tasks.yaml
#
# Running it directly (`uv run maestro run tasks.yaml`) works and is useful
# while authoring, but it bypasses the durable request, the per-repository
# lock and the receipt — which is the thing pass 1 is meant to exercise.
#
# -----------------------------------------------------------------------------
# Operator precondition (temporary until andrei-shtanakov/maestro#216)
# -----------------------------------------------------------------------------
# BEFORE submitting the run, create and switch this checkout to
# `pilot/entrypoint-token-boundary-match` yourself. Mode 1 has no run-level
# branch isolation — `branch_prefix` below is silently ignored — so with
# `auto_commit: true` the run commits to whatever branch is checked out. The
# first pilot pass landed its commits straight on `master` exactly this way
# (deployer#34); `master` had to be rolled back by hand. The first task of the
# DAG verifies this precondition and stops the run before anything is written
# if the checkout is wrong. This is an explicitly named stopgap for the period
# until maestro#216, not a permanent scheme.
#
# -----------------------------------------------------------------------------
# `repo:` is load-bearing, not decoration
# -----------------------------------------------------------------------------
# maestro keys a Mode-1 run by THIS field, never by the working directory the
# process was started in. `identity_from_config` first looks for a `repo_url:`
# declaration; failing that, it treats `repo:` as a path to a checkout and
# reads that checkout's `origin` remote
# (maestro/maestro/repo_identity.py:103-135, called at run_bootstrap.py:68).
# Everything downstream — which `runs/` directory the state lands in, which
# repository dispatcher locks, which checkout the revision guard governs —
# follows from it.
#
# Copying this file into another repository and forgetting to change `repo:`
# would make maestro edit THIS clone while the request names the other one.
# dispatcher refuses that mismatch since #167, by reading this field and
# comparing it against the request. That check is the reason the mistake is
# survivable; it is not a reason to be careless here.
# =============================================================================

project: deployer-pilot

# Why an absolute path, and why not a relative one — both settled by running
# the producer, not by preference:
#
#   - a relative `repo:` is REFUSED outright: "Repository path must be an
#     absolute path (starting with / or ~)". maestro will not load this file
#     at all with `repo: .`;
#   - `repo_url:` — which would be machine-independent — is a Mode-2 field.
#     `ProjectConfig` (Mode 1) has no such field, so the option does not
#     exist here.
#
# So `~`-relative is the most portable form the schema allows, and it is what
# maestro's own example uses (maestro/examples/maestro-builds-maestro.yaml:18).
# It does assume the fleet's layout — `~/labs/all_ai_orchestrators/<repo>`.
# When that assumption is wrong the failure is loud, not silent: the path does
# not resolve, `identity_from_checkout` raises `IdentityError`, and the run
# refuses to start rather than picking some other repository.
repo: ~/labs/all_ai_orchestrators/deployer

max_concurrent: 1  # the three tasks are strictly ordered; nothing to overlap

git:
  base_branch: master   # deployer's default is `master`, and GitConfig's own
                        # default is `main` — leaving it unset would branch
                        # from a branch that does not exist here
  auto_commit: true     # each task's result must be a commit: the red→green
                        # pair below IS the evidence, and it only exists if
                        # both halves land in history
  auto_push: false      # pushing is outward-facing and belongs to the
                        # contour's brokered short action, not to an agent
                        # run. See the open question at the bottom of this
                        # file — pass 1 has to settle who pushes.
  branch_prefix: "pilot/"
                        # ^ Mode 1 IGNORES this setting silently. GitManager,
                        # its only consumer, is constructed on the Mode-2 path
                        # alone (maestro/cli.py:1783); Mode-1 `run_command`
                        # creates no branches at all, so the run writes to the
                        # branch that is checked out. Tracked upstream as
                        # andrei-shtanakov/maestro#216. Until that lands, the
                        # `branch-precondition` task below is the actual guard,
                        # and the operator switches to the ONE branch this DAG
                        # accepts — `pilot/entrypoint-token-boundary-match` —
                        # before submitting (see the header). Kept here for
                        # the day the setting becomes real.

defaults:
  timeout_minutes: 20
  max_retries: 1
  agent_type: claude_code

tasks:
  # ---------------------------------------------------------------------------
  # 0. PRECONDITION — verify the branch, do not create it
  # ---------------------------------------------------------------------------
  # Why verify instead of `git switch -c` (deployer#34): a switch inside the
  # task would be an agent action, not a runtime guarantee — the agent can
  # refuse or err and leave the run on `master`, and by the time task 1 starts
  # the checkout is already treated as accepted, smearing the isolation
  # contract across every DAG. A precondition check has no such flaw: it
  # either confirms the state the operator already established, or stops the
  # run before anything is written. The `validation_cmd` repeats the check
  # deterministically, so even an agent that wrongly reports success cannot
  # let the run proceed on the wrong branch.
  # ---------------------------------------------------------------------------
  - id: branch-precondition
    title: "Precondition: clean checkout on pilot/entrypoint-token-boundary-match"
    prompt: |
      Verify that the working copy is ready for this pilot run. Change
      NOTHING: no file edits, and no git commands that mutate state (no
      switch, no branch, no stash, no checkout). Run exactly these two
      read-only commands:

        git rev-parse --abbrev-ref HEAD
        git status --porcelain

      The run may proceed only if BOTH of the following hold:

        - the current branch is exactly `pilot/entrypoint-token-boundary-match`
          (in particular it is NOT `master` and NOT `main`);
        - `git status --porcelain` prints nothing (the tree is clean).

      If either check fails, report the exact mismatch and FAIL this task.
      Do not attempt to repair the state and do not create or switch
      branches — the operator fixes the checkout and resubmits the run.
    validation_cmd: >-
      bash -c 'test "$(git rev-parse --abbrev-ref HEAD)" =
      "pilot/entrypoint-token-boundary-match" && test -z
      "$(git status --porcelain)"'

  # ---------------------------------------------------------------------------
  # 1. RED — the failing test, committed on its own
  # ---------------------------------------------------------------------------
  # Separate from the fix on purpose. If one task wrote the test and the fix
  # together, "the test failed first" would be a claim in a report. As two
  # commits it is a fact anyone can re-run: check out the first, run the test,
  # watch it fail. That is what dispatcher spec §9.2 means by the contour
  # carrying its own red/green evidence — deployer's CI runs no tests at all
  # (its only workflow is the governance caller), so nothing else will produce
  # this evidence for us.
  # ---------------------------------------------------------------------------
  - id: red-test
    title: "Failing test: a short entrypoint must not match a longer filename"
    depends_on: [branch-precondition]
    prompt: |
      `_check_entrypoint_in_command` in src/deployer/verify.py currently does
      `if target.entrypoint in haystack:` — a plain substring test against the
      raw text of the image's ENTRYPOINT/CMD arguments. So an operator
      entrypoint of `app` passes against `CMD ["python", "application.py"]`,
      which is a false pass: the image does not run `app` at all.

      Add ONE test to tests/test_verify_static.py, beside the existing
      entrypoint checks (they start at the `-- Task 3: L1 check
      entrypoint_in_command --` comment, around line 818). It must:

        - build a Dockerfile whose final stage is
          `CMD ["python", "application.py"]`
        - use a DeployTarget whose entrypoint is `app`
        - assert the check FAILS

      Follow the shape of the neighbouring tests exactly — `_project(tmp_path)`
      for the tree, `_by_id(report, "entrypoint_in_command")` for the result.
      Name it for the behaviour, not the bug number.

      DO NOT touch src/deployer/verify.py in this task. The test must fail
      when you are done, and that failure is the deliverable.

      Run `uv run pytest tests/test_verify_static.py -v` and paste the failing
      output into your report, with the assertion line. Then confirm the rest
      of that file still passes — exactly one new failure, no others.
    scope:
      - "tests/test_verify_static.py"

  # ---------------------------------------------------------------------------
  # 2. GREEN — token-boundary matching
  # ---------------------------------------------------------------------------
  # The token model is decided here rather than left to the implementer,
  # because it is a design decision with consequences for three existing tests
  # and the golden corpus — dispatcher spec §9.1 calls it out as "a decision
  # inside the pass", and a decision made silently mid-run is one nobody
  # reviewed.
  # ---------------------------------------------------------------------------
  - id: token-match
    title: "Match the entrypoint on token boundaries, not as a substring"
    depends_on: [red-test]
    prompt: |
      Make the test from the previous task pass, without breaking the four
      entrypoint tests already in tests/test_verify_static.py.

      THE TOKEN MODEL — use this one, do not invent another:

        Split the haystack into tokens on every character that cannot appear
        in a filename or a [project.scripts] name — whitespace, `[`, `]`,
        `"`, `'`, `,` — and compare each WHOLE token against the entrypoint.
        A match is token equality, never containment.

      Check it against every case that already exists, and put these in the
      test file as the evidence that the model is right rather than merely
      new:

        exec form      CMD ["python", "app.py"]        entrypoint app.py   MATCH
        shell form     CMD python app.py               entrypoint app.py   MATCH
        scripts name   CMD ["serve"]                   entrypoint serve    MATCH
        entrypoint+cmd ENTRYPOINT ["python","app.py"]  entrypoint app.py   MATCH
        the new case   CMD ["python","application.py"] entrypoint app      NO
        conservatism   CMD python -m main              entrypoint main.py  NO

      The last row matters: the current docstring promises `python -m main`
      does NOT satisfy `main.py`, and the token model must keep that promise.

      Do NOT use a regex word-boundary (`\bapp\b`) for this. `.` is not a word
      character, so `\bapp\b` matches INSIDE `app.py` — it would accept an
      entrypoint of `app` against `CMD ["python", "app.py"]`, which is a
      different false pass from the one we are fixing.

      Update the function's docstring in the same edit. It currently states
      the substring behaviour as deliberate ("Substring match covers exec
      form, shell form, and [project.scripts] names alike; deliberately
      conservative") — that sentence becomes false with this change, and a
      docstring describing behaviour the code no longer has is worse than
      none.

      Then check corpus/golden/golden.json: it pins `entrypoint_in_command`
      results (around line 199). If any golden entry changes, regenerate it
      the way this repo regenerates goldens and say in your report which
      entries moved and why. If none change, say that too — silence here
      reads as "not checked".

      Run `uv run pytest -v` (the whole suite, not just the one file) and
      paste the result.
    scope:
      - "src/deployer/verify.py"
      - "tests/test_verify_static.py"
      - "corpus/golden/golden.json"
    validation_cmd: "uv run pytest tests/test_verify_static.py -q"

  # ---------------------------------------------------------------------------
  # 3. Phase 1 of closing the item — annotate, do not tick
  # ---------------------------------------------------------------------------
  # dispatcher spec §8.1: the box cannot be ticked here, because the PR number
  # does not exist yet and a `[x]` without one is exactly the memory-retired
  # record the whole contour exists to replace. Phase 2 — flipping the box
  # with `(#<pr>)` — happens after the PR is opened. See the open question.
  # ---------------------------------------------------------------------------
  - id: todo-phase-1
    title: "Annotate the TODO item with the branch carrying the fix"
    depends_on: [token-match]
    prompt: |
      In TODO.md, find the checkbox line whose id is
      `@id:entrypoint-token-boundary-match` (around line 84).

      Leave it as `- [ ]`. It is not done: nothing is merged.

      Add the branch carrying the work to the continuation line beneath it, in
      the style the surrounding entries use for extra detail. Do NOT put it on
      the checkbox line itself and do NOT add tags there — that line is parsed
      line-by-line and is already at its useful length.

      Do not add `[x]`, do not add a PR number, do not remove the line. The
      repository's own convention (CLAUDE.md, "Планы") is that a closed item
      carries `[x]` AND a PR number, and that a line is never deleted because
      delta counters read a disappearance as "closed".
    scope:
      - "TODO.md"

# =============================================================================
# Open question pass 1 has to settle — do not paper over it
# =============================================================================
# `auto_push` is false above, so this DAG produces commits on a local branch
# and nothing more. For a PR to exist, that branch must reach the remote.
#
# What is NOT known at authoring time: whether the contour's `open-pr` short
# action pushes the branch itself, or expects it already pushed. The vendored
# contract (dispatcher contracts/github-checker-actions/v1) describes the
# RESULT of the verb — `pr_url`, `pr_state`, `ok` — and says nothing about
# push behaviour, and guessing from the result shape is exactly the kind of
# reading-instead-of-running that has been wrong repeatedly on this contour.
#
# So pass 1 determines it by observation, and records the answer here:
#   - if `open-pr` pushes, this file needs no change;
#   - if it does not, either the contour gains a push step or `auto_push`
#     becomes true — and if it becomes true, that is an outward-facing action
#     moving inside an agent run, which deserves its own decision rather than
#     a quiet flag flip.
#
# Phase 2 of the TODO closure waits on the same answer: it needs a PR number,
# so it cannot be a task in this DAG. When it happens, it is not just a tick —
# this repository's own convention (CLAUDE.md, "Git workflow") is that a PR
# closing a TODO item **moves that item into `## Shipped`** (TODO.md:124) and
# adds any new open items the work produced. So phase 2 is: flip the box with
# `(#<pr>)`, move the line under `## Shipped`, and record whatever the pass
# turned up — including the push answer above. The cross-repo digest reads
# this file, and a stale TODO.md is worse than a missing one.
# =============================================================================
